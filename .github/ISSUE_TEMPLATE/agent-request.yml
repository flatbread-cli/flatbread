name: Read another agent
description: Ask Flatbread to read sessions from a coding agent it does not read yet.
labels: [agent]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Zed 0.190
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it keeps its sessions
      description: The folder and file type, if you know them. Do not attach a session file.
  - type: textarea
    id: why
    attributes:
      label: What you would share from it
